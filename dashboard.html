<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Dashboard — IA STORE Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin" data-page="dashboard">
  <div class="admin-layout">
    <aside class="sidebar" id="admin-sidebar"></aside>
    <div class="admin-backdrop" id="admin-backdrop"></div>

    <div class="admin-content">
      <header class="admin-top" id="admin-top"></header>

      <main class="admin-main">
        <div class="stats" id="stats"></div>

        <section class="panel">
          <div class="panel__head">
            <div>
              <h2>Inventory</h2>
              <p class="muted">Edit the quantity of each size, then press Save on that row.</p>
            </div>
            <div class="panel__tools">
              <div class="tabs" id="inv-tabs">
                <button type="button" class="tab is-active" data-filter="all">All</button>
                <button type="button" class="tab" data-filter="low">Low stock <b id="cnt-low">0</b></button>
                <button type="button" class="tab" data-filter="out">Out of stock <b id="cnt-out">0</b></button>
              </div>
              <input class="input input--search" id="inv-search" type="search" placeholder="Search products…" aria-label="Search products">
            </div>
          </div>
          <div class="inv-list" id="inv-list"><div class="empty">Loading…</div></div>
        </section>
      </main>
    </div>
  </div>
  <script type="module" src="../js/admin.js"></script>
</body>
</html>
